name: APK Size Diff

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [develop]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: apk-size-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          echo "$DEBUG_KEYSTORE" | base64 -d > ./app/boolti-keystore.keystore
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
          echo "$LOCAL_PROPERTIES" > local.properties
          echo "$GOOGLE_SERVICES" | base64 -d > ./app/google-services.json
          ./gradlew assembleDebug --stacktrace

      - name: Download baseline APK
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          workflow: apk-size-baseline.yml
          name: baseline-debug-apk
          path: baseline
          workflow_conclusion: success

      - name: Compute diff and upsert comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const currentPath = 'app/build/outputs/apk/debug/app-debug.apk';
            const baselinePath = 'baseline/app-debug.apk';

            if (!fs.existsSync(currentPath)) {
              core.setFailed('Current APK not found: ' + currentPath);
              return;
            }

            const currentSize = fs.statSync(currentPath).size;
            const baselineSize = fs.existsSync(baselinePath)
              ? fs.statSync(baselinePath).size
              : null;

            const toMB = (bytes) => (bytes / 1024 / 1024).toFixed(2) + ' MB';
            const KB = 1024;
            const MB = 1024 * 1024;

            const marker = '<!-- apk-size-diff -->';
            let body;
            if (baselineSize === null) {
              body = `${marker}\n📦 APK size: **${toMB(currentSize)}** (baseline 없음 — develop push 후 재실행하면 비교 가능)`;
            } else {
              const diff = currentSize - baselineSize;
              const absDiff = Math.abs(diff);
              const pct = baselineSize > 0
                ? ((diff / baselineSize) * 100).toFixed(2)
                : '0.00';
              const sign = diff > 0 ? '+' : '';
              const header = `APK size: **${toMB(currentSize)}** (${sign}${toMB(diff)}, ${sign}${pct}%) vs \`develop\``;

              let icon, note;
              if (absDiff < KB) {
                icon = '🟢';
                note = '거의 변화 없음';
              } else if (diff < 0) {
                if (absDiff >= MB) {
                  icon = '🎉';
                  note = `무려 ${toMB(absDiff)} 감량! 사이즈 다이어트 성공 🚀`;
                } else if (absDiff >= 100 * KB) {
                  icon = '🔻';
                  note = '감량 고생하셨어요 👏';
                } else {
                  icon = '🔻';
                  note = '살짝 슬림해졌어요 🙂';
                }
              } else {
                if (absDiff >= 5 * MB) {
                  icon = '🚨';
                  note = '상당히 커졌어요! 리소스·의존성 점검 필요';
                } else if (absDiff >= MB) {
                  icon = '⚠️';
                  note = '꽤 무거워졌어요. 꼭 필요한 변경인지 확인 부탁';
                } else if (absDiff >= 100 * KB) {
                  icon = '🔺';
                  note = '사이즈가 살짝 늘었네요';
                } else {
                  icon = '🔺';
                  note = '작은 증가';
                }
              }

              body = `${marker}\n${icon} ${header} — ${note}`;
            }

            const pr = context.payload.pull_request;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
            const existing = comments.find(c =>
              c.body &&
              c.body.includes(marker) &&
              c.user &&
              c.user.login === 'github-actions[bot]'
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
