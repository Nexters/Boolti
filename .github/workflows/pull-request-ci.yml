name: Android Pull Request CI

on:
  pull_request:
    branches: [ develop, 'feature/**' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.idea/**'

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write
  actions: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          echo "$KEYSTORE" | base64 -d > ./app/boolti-keystore.keystore
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
          echo "$LOCAL_PROPERTIES" > local.properties
          echo "$GOOGLE_SERVICES" | base64 -d > ./app/google-services.json
          ./gradlew btTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Download baseline APK size
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        continue-on-error: true
        with:
          workflow: apk-size-baseline.yml
          name: baseline-apk-size
          path: baseline
          workflow_conclusion: success

      - name: APK size diff comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const commentApkSize = require('./.github/scripts/apk-size-comment.js');
            await commentApkSize({ github, context, core });

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "**/test-results/**/*.xml"

      - name: Notify Discord on failure
        if: failure() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || exit 0
          jq -n --arg c "❌ CI 실패: #$PR_NUMBER $PR_TITLE"$'\n'"$RUN_URL" '{content: $c}' \
            | curl -sf -H 'Content-Type: application/json' -d @- "$DISCORD_WEBHOOK_URL"
